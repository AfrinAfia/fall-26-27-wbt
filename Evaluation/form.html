<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Donation Form</title>
</head>

<body>
    <form action="#" method="post">
        <table>
            <tr>
                <td colspan="2">Donor Information</td>
            </tr>
            <tr>
                <td><label for="fname">First Name</label></td>
                <td><input type="text" id="fname" name="fname" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name</label></td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td><label for="com">Company</label></td>
                <td><input type="text" id="com" name="com"></td>
            </tr>
            <tr>
                <td><label for="ad1">Address 1</label></td>
                <td><input type="text" id="ad1" name="ad1" required></td>
            </tr>
            <tr>
                <td><label for="ad2">Address 2</label></td>
                <td><input type="text" id="ad2" name="ad2"></td>
            </tr>
            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state">State</label></td>
                <td><select id="state" name="state" required>
                        <option value="">Please Select</option>
                        <option>Bogura</option>
                        <option>Khulna</option>
                        <option>Barishal</option>
                        <option>Rangpur</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zcode">Zip Code</label></td>
                <td><input type="number" id="zcode" name="zcode" required></td>
            </tr>
            <tr>
                <td><label for="country">Country</label></td>
                <td><select id="country" name="country" required>
                        <option value="">Please Select</option>
                        <option>Bangladesh</option>
                        <option>UK</option>
                        <option>USA</option>
                        <option>Pakistan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="tel" id="fax" name="fax"></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td>Donation Amount<br>(check a button or type your<br>amount)</td>
                <td>
                    <input type="radio" name="amount" value="none">none
                    <input type="radio" name="amount" value="50">$50
                    <input type="radio" name="amount" value="75">$75
                    <input type="radio" name="amount" value="100">$100
                    <input type="radio" name="amount" value="250">$250
                    <input type="radio" name="amount" value="other">Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td><label for="otheramount">Other Amount</label></td>
                <td><input type="number" id="otheramount" name="otheramount"></td>
            </tr>
        </table>
        <table>
            <tr>
                <td colspan="2">Honorarium And Memorial Donation Information</td>
            </tr>
            <tr>
                <td><label>I would like to make this<br>Donation</label></td>
                <td>
                    <input type="radio" name="hmd" value="th">To Honor
                    <input type="radio" name="hmd" value="imo">In Memory Of
                </td>
            </tr>
            <tr>
                <td><label for="honname">First Name</label></td>
                <td><input type="text" id="honname" name="honname"></td>
            </tr>
            <tr>
                <td><label for="adt">Acknowledge Donation to</label></td>
                <td><input type="text" id="adt" name="adt"></td>
            </tr>
            <tr>
                <td><label for="adr">Address</label></td>
                <td><input type="text" id="adr" name="adr"></td>
            </tr>
            <tr>
                <td><label for="honcity">City</label></td>
                <td><input type="text" id="honcity" name="honcity"></td>
            </tr>
            <tr>
                <td><label for="honstate">State</label></td>
                <td><select id="honstate" name="honstate">
                        <option value="">Please Select</option>
                        <option>Bogura</option>
                        <option>Khulna</option>
                        <option>Barishal</option>
                        <option>Rangpur</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip</label></td>
                <td><input type="number" id="zip" name="zip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>

        </table>
    </form>

</body>

</html>
